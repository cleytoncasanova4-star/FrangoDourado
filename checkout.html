<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Finalizar Pedido — Frango Dourado</title>
<link rel="stylesheet" href="css/checkout.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="pd-header">
  <div class="pd-inner">
    <div class="pd-brand-text">
      <b>FRANGO <span>DOURADO</span></b>
    </div>
    <a href="pedido.html" class="pd-voltar">← Voltar ao menu</a>
  </div>
</header>

<main class="pd-main">
  <div style="text-align: center; margin-bottom: 20px;">
    <h1 style="font-family: 'Rajdhani'; font-size: 26px; color: var(--texto);">Finalizar Pedido</h1>
    <p style="color: var(--texto-leve); font-size: 14px;">Preencha os dados para receber em casa.</p>
  </div>

  <!-- MODO DE ENTREGA -->
  <section class="checkout-section">
    <h2>1. Como quer receber?</h2>
    <div class="pd-modos">
      <label class="pd-modo">
        <input type="radio" name="pd-modo" value="entrega" checked onchange="toggleModo()"/>
        <div class="pd-modo-inner">
          <span class="pd-modo-icon">🛵</span>
          <b>ENTREGA</b>
          <small>Recebe em casa</small>
        </div>
      </label>
      <label class="pd-modo">
        <input type="radio" name="pd-modo" value="retirada" onchange="toggleModo()"/>
        <div class="pd-modo-inner">
          <span class="pd-modo-icon">🏪</span>
          <b>RETIRAR</b>
          <small>No restaurante</small>
        </div>
      </label>
    </div>

    <!-- CAMPOS EXCLUSIVOS DE ENTREGA -->
    <div id="pdFieldsEntrega">
      <div class="pd-field">
        <label>Escolha a sua Zona</label>
        <div id="pdZonas"></div>
      </div>
      
      <div class="pd-field">
        <label>Endereço / Localização</label>
        <input type="text" id="pdEndereco" placeholder="Ex.: Bairro, rua, número"/>
      </div>

      <!-- NOVO CAMPO: PONTO DE REFERÊNCIA -->
      <div class="pd-field">
        <label>Ponto de Encontro</label>
        <input type="text" id="pdReferencia" placeholder="Ex.: Próximo à farmácia, portão azul..."/>
      </div>

      <div class="pd-field">
        <label>Escolha o Entregador</label>
        <div id="pdEntregadores"></div>
      </div>
    </div>
  </section>

  <!-- DADOS DO CLIENTE -->
  <section class="checkout-section">
    <h2>2. Os seus dados</h2>
    <div class="pd-field">
      <label>Nome Completo</label>
      <input type="text" id="pdNomeCliente" placeholder="O seu nome"/>
    </div>
    <div class="pd-field">
      <label>Telefone (WhatsApp)</label>
      <input type="tel" id="pdTelefone" placeholder="Ex.: 84XXXXXXX"/>
    </div>
    <div class="pd-field">
      <label>Observações (Opcional)</label>
      <textarea id="pdObs" rows="2" placeholder="Ex.: Sem piri-piri, troco para 500..."></textarea>
    </div>
  </section>

  <button class="pd-btn-final" id="pdVerResumo" disabled>VER RESUMO →</button>
</main>

<!-- MODAL RESUMO -->
<div class="modal-resumo" id="pdModalResumo">
  <div class="modal-box">
    <h2>Resumo do Pedido</h2>
    <div id="pdResumoBody" style="margin-bottom:20px;"></div>
    <div style="display:flex; gap:10px;">
      <button onclick="document.getElementById('pdModalResumo').classList.remove('active')" style="flex:1; padding:15px; border-radius:12px; border:none; background:#eee; font-weight:700; cursor:pointer;">Editar</button>
      <button id="pdResumoEnviar" style="flex:2; padding:15px; border-radius:12px; border:none; background:var(--primaria); color:white; font-weight:800; cursor:pointer;">Enviar p/ WhatsApp</button>
    </div>
  </div>
</div>

<!-- MODAL DE ZOOM DA FOTO DO ENTREGADOR -->
<div class="modal-zoom" id="modalZoomEntregador">
  <div class="zoom-container">
    <button class="zoom-close" onclick="fecharZoom()">✕</button>
    <img id="imgZoomEntregador" src="" alt="Foto do Entregador">
    <h3 id="nomeZoomEntregador" style="color: white; margin-top: 15px; text-align: center; font-family: 'Rajdhani';"></h3>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
