<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Pedir — Frango Dourado</title>
<link rel="stylesheet" href="css/pedido.css"/>
</head>
<body>

<header class="pd-header">
  <div class="pd-inner">
    <a href="index.html" class="pd-brand">
      <div class="pd-logo">
        <svg viewBox="0 0 60 50">
          <defs>
            <linearGradient id="frangoGradPed" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFD200"/>
              <stop offset="60%" stop-color="#FFB800"/>
              <stop offset="100%" stop-color="#E30613"/>
            </linearGradient>
          </defs>
          <ellipse cx="30" cy="28" rx="16" ry="14" fill="url(#frangoGradPed)"/>
          <circle cx="30" cy="14" r="8" fill="url(#frangoGradPed)"/>
          <path d="M24 8 L26 4 L28 8 L30 3 L32 8 L34 4 L36 8" stroke="#E30613" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
     <div class="pd-brand-text">
  <b>FRANGO <span style="color: #FFB800;">DOURADO</span></b>
  <small>PEDIR AGORA</small>
</div>
    </a>

    <div class="pd-header-actions">
      <button class="pd-cart-btn" id="pdCartBtn">
        🛒 <span class="pd-cart-badge" id="pdCartBadge">0</span>
      </button>
      <a href="index.html" class="pd-voltar">← Voltar</a>
    </div>
  </div>
</header>

<main class="pd-main">
  <div class="pd-titulo">
    <h1>O que vai pedir hoje?</h1>
    <p>Toque no botão + para adicionar ao carrinho.</p>
  </div>

  <!-- CATEGORIAS (OS IDs AQUI SÃO CRUCIAIS) -->
  <section class="pd-section">
    <h2>Hamburgers</h2>
    <div class="pd-menu-grid" id="pdCatHamburgers"></div>
  </section>

  <section class="pd-section">
    <h2> Frango & Wraps</h2>
    <div class="pd-menu-grid" id="pdCatFrango"></div>
  </section>

  <section class="pd-section">
    <h2> Acompanhamentos</h2>
    <div class="pd-menu-grid" id="pdCatAcompanhamentos"></div>
  </section>

  <section class="pd-section">
    <h2> Refrigerantes</h2>
    <div class="pd-menu-grid" id="pdCatRefrigerantes"></div>
  </section>
</main>

<!-- O MINI CARRINHO LATERAL -->
<div class="pd-cart-overlay" id="pdCartOverlay"></div>
<aside class="pd-cart-drawer" id="pdCartDrawer">
  <div class="pd-cart-head">
    <h2>O seu carrinho</h2>
    <button class="pd-cart-close" id="pdCartClose">✕</button>
  </div>
  <div class="pd-cart-body" id="pdCartBody"></div>
  <div class="pd-cart-foot">
    <div class="pd-cart-total">
      <span>Subtotal</span>
      <b id="pdCartTotal">0 MT</b>
    </div>
    <button class="pd-cart-checkout" id="pdCartCheckout" disabled>CONTINUAR →</button>
  </div>
</aside>

<script src="js/config.js"></script>
<script src="js/pedido.js"></script>
</body>
</html>
